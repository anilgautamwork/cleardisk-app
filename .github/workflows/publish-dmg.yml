name: Publish notarized DMG
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the exact tagged source
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$SOURCE_REPO.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download and verify the notarized build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re, urllib.request
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
          manifest = json.loads(pathlib.Path('releases', tag + '.json').read_text())
          assert tag == 'v' + manifest['version']
          url = manifest['download_url']
          assert url.startswith('https://raw.githubusercontent.com/anilgautamwork/cleardisk-website/')
          data = urllib.request.urlopen(url, timeout=60).read()
          assert len(data) == manifest['bytes']
          assert hashlib.sha256(data).hexdigest() == manifest['sha256']
          name = 'ClearDisk-' + manifest['version'] + '.dmg'
          pathlib.Path(name).write_bytes(data)
          pathlib.Path('SHA256SUMS.txt').write_text(manifest['sha256'] + '  ' + name + '\n')
          PYTHON
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" ClearDisk-*.dmg SHA256SUMS.txt --verify-tag --prerelease --title "ClearDisk ${RELEASE_TAG#v} preview" --notes-file "releases/$RELEASE_TAG.md"

name: Publish notarized DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or verify using this branch's manifest
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the exact tagged source
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$SOURCE_REPO.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download and verify the notarized build
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re, urllib.request
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
          manifest = json.loads(pathlib.Path('releases', tag + '.json').read_text())
          assert tag == 'v' + manifest['version']
          url = manifest['download_url']
          assert url.startswith('https://raw.githubusercontent.com/anilgautamwork/cleardisk-website/')
          data = urllib.request.urlopen(url, timeout=60).read()
          assert len(data) == manifest['bytes']
          assert hashlib.sha256(data).hexdigest() == manifest['sha256']
          name = 'ClearDisk-' + manifest['version'] + '.dmg'
          pathlib.Path(name).write_bytes(data)
          pathlib.Path('SHA256SUMS.txt').write_text(manifest['sha256'] + '  ' + name + '\n')
          PYTHON
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft,assets > existing-release.json; then
            # A manual release may already be live. Verify it; never overwrite assets.
            python3 - <<'PYTHON'
          import json, os, pathlib
          tag = os.environ['RELEASE_TAG']
          manifest = json.loads(pathlib.Path('releases', tag + '.json').read_text())
          release = json.loads(pathlib.Path('existing-release.json').read_text())
          assert not release['isDraft'], 'Existing release is still a draft'
          name = 'ClearDisk-' + manifest['version'] + '.dmg'
          assets = [a for a in release['assets'] if a['name'] == name]
          assert len(assets) == 1, 'Expected exactly one versioned DMG'
          assert assets[0]['size'] == manifest['bytes'], 'Published size differs'
          assert assets[0]['digest'] == 'sha256:' + manifest['sha256'], 'Published digest differs'
          print('Existing published release matches the verified manifest; no assets changed.')
          PYTHON
          else
            gh release create "$RELEASE_TAG" ClearDisk-*.dmg SHA256SUMS.txt --verify-tag --title "ClearDisk ${RELEASE_TAG#v}" --notes-file "releases/$RELEASE_TAG.md"
          fi

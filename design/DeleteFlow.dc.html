<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color: #1d1d1f; }
    a { color: #0071e3; text-decoration: none; } a:hover { color: #0077ed; }
  </style>
</helmet>
<div style="width: 1200px; height: 780px; position: relative; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #d2d2d7;">

  <!-- Dimmed app backdrop (simplified) -->
  <div style="position: absolute; inset: 0; display: flex; opacity: 0.55;">
    <div style="width: 248px; background: #f5f5f7; border-right: 1px solid #e8e8ed; padding: 16px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; gap: 8px;">
        <div style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57;"></div>
        <div style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e;"></div>
        <div style="width: 12px; height: 12px; border-radius: 6px; background: #28c840;"></div>
      </div>
      <div style="background: #ffffff; border: 1px solid #e8e8ed; border-radius: 12px; height: 160px;"></div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 30px; border-radius: 8px;"></div>
        <div style="height: 30px; border-radius: 8px; background: #dcdce1;"></div>
        <div style="height: 30px; border-radius: 8px;"></div>
        <div style="height: 30px; border-radius: 8px;"></div>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <div style="height: 52px; border-bottom: 1px solid #e8e8ed;"></div>
      <div style="padding: 22px 24px; font-size: 40px; font-weight: 700; color: #c7c7cc;">187.4 GB</div>
      <div style="flex-grow: 1; padding: 0 24px; display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 56px; background: #f0f7ff; border: 1px solid #cfe5ff; border-radius: 10px;"></div>
        <div style="height: 56px; background: #f0f7ff; border: 1px solid #cfe5ff; border-radius: 10px;"></div>
        <div style="height: 56px; background: #fafafa; border: 1px solid #ececf0; border-radius: 10px;"></div>
        <div style="height: 56px; background: #fafafa; border: 1px solid #ececf0; border-radius: 10px;"></div>
        <div style="height: 56px; background: #f0f7ff; border: 1px solid #cfe5ff; border-radius: 10px;"></div>
        <div style="height: 56px; background: #f0f7ff; border: 1px solid #cfe5ff; border-radius: 10px;"></div>
      </div>
      <div style="height: 72px; border-top: 1px solid #e8e8ed; background: #fbfbfd;"></div>
    </div>
  </div>

  <!-- Scrim -->
  <div style="position: absolute; inset: 0; background: rgba(20, 20, 24, 0.28);"></div>

  <!-- Dialog -->
  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; background: #ffffff; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.28); padding: 26px 26px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #eef4ff; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0071e3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 4.5h5M6.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-12.5M10 11v6M14 11v6"></path></svg>
      </div>
      <div style="font-size: 17px; font-weight: 700; text-align: center;">Move 4 items to the Trash?</div>
    </div>

    <div style="display: flex; flex-direction: column; border: 1px solid #ececf0; border-radius: 10px; overflow: hidden;">
      <div style="display: flex; justify-content: space-between; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f2;">
        <div>Application caches</div><div style="font-weight: 600;">18.7 GB</div>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f2;">
        <div>Xcode &amp; simulator files</div><div style="font-weight: 600;">30.0 GB</div>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f2;">
        <div>Browser caches</div><div style="font-weight: 600;">8.7 GB</div>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f2;">
        <div>Logs</div><div style="font-weight: 600;">6.4 GB</div>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 14px; font-size: 13px; background: #fbfbfd;">
        <div style="font-weight: 700;">Total to reclaim</div><div style="font-weight: 700; color: #1d7a3e;">63.8 GB</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 8px; background: #f5f9f6; border-radius: 10px; padding: 10px 12px;">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#1d7a3e" stroke-width="1.8" stroke-linecap="round" style="margin-top: 1px; flex-shrink: 0;"><path d="M10 2.5 3.5 5v4.5c0 4 2.8 6.9 6.5 8 3.7-1.1 6.5-4 6.5-8V5L10 2.5z"></path><path d="M7.2 10.2 9 12l3.8-3.8"></path></svg>
      <div style="font-size: 12.5px; color: #3a5c44; line-height: 1.45;">Nothing is permanently deleted. Everything goes to your Trash, and you can put it back anytime.</div>
    </div>

    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <div style="padding: 9px 18px; border-radius: 9px; border: 1px solid #d2d2d7; font-size: 13.5px; font-weight: 500; background: #ffffff;">Cancel</div>
      <div style="padding: 9px 18px; border-radius: 9px; background: #0071e3; color: #ffffff; font-size: 13.5px; font-weight: 600;">Move to Trash</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
